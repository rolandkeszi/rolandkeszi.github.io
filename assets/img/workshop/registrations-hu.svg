<title id="t">Regisztrációk a workshopra</title>
<desc id="d">A regisztrációk száma szeptember 8-i 11-ről szeptember 21-ig 74-re nőtt, egy hétig alig változott, majd az utolsó napokban 97-re emelkedett a szeptember 30-i lezárásig.</desc>
